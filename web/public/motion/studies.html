document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

re gradient ---- */\n  --wn-gradient:    linear-gradient(135deg, #FF4FCB 0%, #9B4DF0 48%, #6C3BFF 100%); /* @kind color */\n  --wn-gradient-soft: linear-gradient(135deg, #FF8FDC 0%, #A78BFF 100%); /* @kind color */\n  --wn-gradient-text: linear-gradient(100deg, #FF6FD3 0%, #8C6BFF 100%); /* @kind color */\n\n  /* ---- Ink (dark surfaces, slightly violet-cooled) ---- */\n  --ink-1000: #07060D;   /* page background        */\n  --ink-900:  #0C0A16;   /* deep panel             */\n  --ink-800:  #110E1E;   /* card surface           */\n  --ink-700:  #1A1530;   /* raised / hover surface */\n  --ink-600:  #271F45;   /* strokes on dark        */\n\n  /* ---- Light tints (from brand sheet) ---- */\n  --paper:       #FFFFFF;\n  --soft-pink:   #FFEFFA;   /* \"Soft Pink\"   chip background */\n  --soft-purple: #EFEAFF;   /* \"Soft Purple\" chip background */\n  --mist:        #F6F4FB;   /* neutral light surface */\n\n  /* ---- Text ---- */\n  --text-strong:   #FFFFFF;\n  --text-body:     #C9C3DA;\n  --text-muted:    #8E87A6;\n  --text-faint:    #5C5675;\n  --text-ondark-invert: #0C0A16;  /* text on light/brand fills */\n\n  /* ---- Borders & dividers ---- */\n  --line:        rgba(255,255,255,0.09);\n  --line-strong: rgba(255,255,255,0.16);\n  --line-light:  rgba(15,10,30,0.10);\n\n  /* ---- Semantic / market ---- */\n  --up:      #2BE2A4;   /* gains  */\n  --down:    #FF5470;   /* losses */\n  --warn:    #FFB020;   /* caution / high-stake zone */\n  --info:    #4DA6FF;\n  --slash:   #FF3D5E;   /* agent slashed / \"death\" */\n  --verify:  #2BE2A4;   /* verified / survived */\n\n  --up-soft:    rgba(43,226,164,0.14);\n  --down-soft:  rgba(255,84,112,0.14);\n  --warn-soft:  rgba(255,176,32,0.14);\n\n  /* ---- Glow accents (rgba for shadows/auras) ---- */\n  --glow-pink:   rgba(255,79,203,0.45);\n  --glow-purple: rgba(108,59,255,0.45);\n\n  /* ---- Semantic surface aliases (default = dark theme) ---- */\n  --bg-page:     var(--ink-1000);\n  --surface:     var(--ink-800);\n  --surface-2:   var(--ink-700);\n  --surface-inset: var(--ink-900);\n  --border:      var(--line);\n}\n<\u002Fstyle>\n  <style>/* ==========================================================================\n   wNEWS — Typography tokens\n   ========================================================================== */\n:root {\n  /* ---- Families ---- */\n  --font-display: 'Space Grotesk', system-ui, sans-serif; /* @kind font */\n  --font-sans:    'Hanken Grotesk', system-ui, sans-serif; /* @kind font */\n  --font-mono:    'JetBrains Mono', ui-monospace, 'SF Mono', monospace; /* @kind font */\n\n  /* ---- Type scale (display-led, fluid hero sizes) ---- */\n  --fs-display:   clamp(3rem, 6.5vw, 5.75rem); /* @kind font */\n  --fs-h1:        clamp(2.25rem, 4vw, 3.5rem); /* @kind font */\n  --fs-h2:        clamp(1.75rem, 3vw, 2.5rem); /* @kind font */\n  --fs-h3:        1.5rem;    /* @kind font */\n  --fs-h4:        1.25rem;   /* @kind font */\n  --fs-lead:      1.25rem;   /* @kind font */\n  --fs-body:      1rem;      /* @kind font */\n  --fs-sm:        0.875rem;  /* @kind font */\n  --fs-xs:        0.75rem;   /* @kind font */\n  --fs-eyebrow:   0.78rem;   /* @kind font */\n\n  /* ---- Weights ---- */\n  --fw-regular:   400; /* @kind font */\n  --fw-medium:    500; /* @kind font */\n  --fw-semibold:  600; /* @kind font */\n  --fw-bold:      700; /* @kind font */\n  --fw-black:     800; /* @kind font */\n\n  /* ---- Line heights ---- */\n  --lh-tight:     1.02; /* @kind font */\n  --lh-snug:      1.12; /* @kind font */\n  --lh-heading:   1.18; /* @kind font */\n  --lh-body:      1.6;  /* @kind font */\n\n  /* ---- Letter spacing ---- */\n  --ls-display:  -0.03em; /* @kind font */\n  --ls-heading:  -0.02em; /* @kind font */\n  --ls-normal:    0;      /* @kind font */\n  --ls-eyebrow:   0.18em; /* @kind font */\n  --ls-mono:      0.01em; /* @kind font */\n}\n<\u002Fstyle>\n  <style>/* ==========================================================================\n   wNEWS — Spacing & layout tokens (4px base grid)\n   ========================================================================== */\n:root {\n  --sp-0:   0; /* @kind spacing */\n  --sp-1:   4px;\n  --sp-2:   8px;\n  --sp-3:   12px;\n  --sp-4:   16px;\n  --sp-5:   20px;\n  --sp-6:   24px;\n  --sp-8:   32px;\n  --sp-10:  40px;\n  --sp-12:  48px;\n  --sp-16:  64px;\n  --sp-20:  80px;\n  --sp-24:  96px;\n  --sp-32:  128px;\n\n  /* ---- Layout ---- */\n  --container:      1200px; /* @kind spacing */\n  --container-wide: 1360px; /* @kind spacing */\n  --container-text: 720px;  /* @kind spacing */\n  --gutter:         24px;   /* @kind spacing */\n  --section-y:      clamp(64px, 9vw, 128px); /* @kind spacing */\n}\n<\u002Fstyle>\n  <style>/* ==========================================================================\n   wNEWS — Effects: radii, shadows, glows, motion, surface treatments\n   ========================================================================== */\n:root {\n  /* ---- Corner radii ---- */\n  --r-xs:   6px;\n  --r-sm:   10px;\n  --r-md:   14px;\n  --r-lg:   20px;\n  --r-xl:   28px;\n  --r-2xl:  36px;\n  --r-pill: 999px;\n\n  /* ---- Elevation (dark UI: shadows are deep + subtle) ---- */\n  --shadow-sm:  0 1px 2px rgba(0,0,0,0.40);\n  --shadow-md:  0 8px 24px rgba(0,0,0,0.45);\n  --shadow-lg:  0 24px 60px rgba(0,0,0,0.55);\n  --shadow-card: 0 1px 0 rgba(255,255,255,0.04) inset, 0 12px 40px rgba(0,0,0,0.45);\n\n  /* ---- Brand glows (auras behind CTAs, logo, hero orbs) ---- */\n  --glow-sm:  0 0 24px var(--glow-purple);\n  --glow-md:  0 8px 40px var(--glow-purple);\n  --glow-lg:  0 16px 70px rgba(155,77,240,0.40);\n  --glow-cta: 0 8px 30px rgba(255,79,203,0.35), 0 4px 14px rgba(108,59,255,0.30);\n\n  /* ---- Hairline brand ring (gradient border helper color) ---- */\n  --ring-grad: linear-gradient(135deg, rgba(255,79,203,0.6), rgba(108,59,255,0.6)); /* @kind color */\n\n  /* ---- Blur (glass panels / nav) ---- */\n  --blur-glass: saturate(140%) blur(16px); /* @kind other */\n\n   Dark-first (crypto-native). Light tints derived from brand sheet.\n   ========================================================================== */\n:root {\n  /* ---- Brand primaries ---- */\n  --wn-pink:        #FF4FCB;   /* Wrapped Pink   */\n  --wn-purple:      #6C3BFF;   /* Wrapped Purple */\n  --wn-pink-600:    #E63FB4;\n  --wn-pink-300:    #FF8FDC;\n  --wn-purple-600:  #5A2DE0;\n  --wn-purple-300:  #A78BFF;\n  --wn-violet:      #9B4DF0;   /* mid blend used in gradient core */\n\n  /* ---- Signature gradient ---- */\n  --wn-gradient:    linear-gradient(135deg, #FF4FCB 0%, #9B4DF0 48%, #6C3BFF 100%); /* @kind color */\n  --wn-gradient-soft: linear-gradient(135deg, #FF8FDC 0%, #A78BFF 100%); /* @kind color */\n  --wn-gradient-text: linear-gradient(100deg, #FF6FD3 0%, #8C6BFF 100%); /* @kind color */\n\n  /* ---- Ink (dark surfaces, slightly violet-cooled) ---- */\n  --ink-1000: #07060D;   /* page background        */\n  --ink-900:  #0C0A16;   /* deep panel             */\n  --ink-800:  #110E1E;   /* card surface           */\n  --ink-700:  #1A1530;   /* raised / hover surface */\n  --ink-600:  #271F45;   /* strokes on dark        */\n\n  /* ---- Light tints (from brand sheet) ---- */\n  --paper:       #FFFFFF;\n  --soft-pink:   #FFEFFA;   /* \"Soft Pink\"   chip background */\n  --soft-purple: #EFEAFF;   /* \"Soft Purple\" chip background */\n  --mist:        #F6F4FB;   /* neutral light surface */\n\n  /* ---- Text ---- */\n  --text-strong:   #FFFFFF;\n  --text-body:     #C9C3DA;\n  --text-muted:    #8E87A6;\n  --text-faint:    #5C5675;\n  --text-ondark-invert: #0C0A16;  /* text on light/brand fills */\n\n  /* ---- Borders & dividers ---- */\n  --line:        rgba(255,255,255,0.09);\n  --line-strong: rgba(255,255,255,0.16);\n  --line-light:  rgba(15,10,30,0.10);\n\n  /* ---- Semantic / market ---- */\n  --up:      #2BE2A4;   /* gains  */\n  --down:    #FF5470;   /* losses */\n  --warn:    #FFB020;   /* caution / high-stake zone */\n  --info:    #4DA6FF;\n  --slash:   #FF3D5E;   /* agent slashed / \"death\" */\n  --verify:  #2BE2A4;   /* verified / survived */\n\n  --up-soft:    rgba(43,226,164,0.14);\n  --down-soft:  rgba(255,84,112,0.14);\n  --warn-soft:  rgba(255,176,32,0.14);\n\n  /* ---- Glow accents (rgba for shadows/auras) ---- */\n  --glow-pink:   rgba(255,79,203,0.45);\n  --glow-purple: rgba(108,59,255,0.45);\n\n  /* ---- Semantic surface aliases (default = dark theme) ---- */\n  --bg-page:     var(--ink-1000);\n  --surface:     var(--ink-800);\n  --surface-2:   var(--ink-700);\n  --surface-inset: var(--ink-900);\n  --border:      var(--line);\n}\n\n/* ==========================================================================\n   wNEWS — Typography tokens\n   ========================================================================== */\n:root {\n  /* ---- Families ---- */\n  --font-display: 'Space Grotesk', system-ui, sans-serif; /* @kind font */\n  --font-sans:    'Hanken Grotesk', system-ui, sans-serif; /* @kind font */\n  --font-mono:    'JetBrains Mono', ui-monospace, 'SF Mono', monospace; /* @kind font */\n\n  /* ---- Type scale (display-led, fluid hero sizes) ---- */\n  --fs-display:   clamp(3rem, 6.5vw, 5.75rem); /* @kind font */\n  --fs-h1:        clamp(2.25rem, 4vw, 3.5rem); /* @kind font */\n  --fs-h2:        clamp(1.75rem, 3vw, 2.5rem); /* @kind font */\n  --fs-h3:        1.5rem;    /* @kind font */\n  --fs-h4:        1.25rem;   /* @kind font */\n  --fs-lead:      1.25rem;   /* @kind font */\n  --fs-body:      1rem;      /* @kind font */\n  --fs-sm:        0.875rem;  /* @kind font */\n  --fs-xs:        0.75rem;   /* @kind font */\n  --fs-eyebrow:   0.78rem;   /* @kind font */\n\n  /* ---- Weights ---- */\n  --fw-regular:   400; /* @kind font */\n  --fw-medium:    500; /* @kind font */\n  --fw-semibold:  600; /* @kind font */\n  --fw-bold:      700; /* @kind font */\n  --fw-black:     800; /* @kind font */\n\n  /* ---- Line heights ---- */\n  --lh-tight:     1.02; /* @kind font */\n  --lh-snug:      1.12; /* @kind font */\n  --lh-heading:   1.18; /* @kind font */\n  --lh-body:      1.6;  /* @kind font */\n\n  /* ---- Letter spacing ---- */\n  --ls-display:  -0.03em; /* @kind font */\n  --ls-heading:  -0.02em; /* @kind font */\n  --ls-normal:    0;      /* @kind font */\n  --ls-eyebrow:   0.18em; /* @kind font */\n  --ls-mono:      0.01em; /* @kind font */\n}\n\n/* ==========================================================================\n   wNEWS — Spacing & layout tokens (4px base grid)\n   ========================================================================== */\n:root {\n  --sp-0:   0; /* @kind spacing */\n  --sp-1:   4px;\n  --sp-2:   8px;\n  --sp-3:   12px;\n  --sp-4:   16px;\n  --sp-5:   20px;\n  --sp-6:   24px;\n  --sp-8:   32px;\n  --sp-10:  40px;\n  --sp-12:  48px;\n  --sp-16:  64px;\n  --sp-20:  80px;\n  --sp-24:  96px;\n  --sp-32:  128px;\n\n  /* ---- Layout ---- */\n  --container:      1200px; /* @kind spacing */\n  --container-wide: 1360px; /* @kind spacing */\n  --container-text: 720px;  /* @kind spacing */\n  --gutter:         24px;   /* @kind spacing */\n  --section-y:      clamp(64px, 9vw, 128px); /* @kind spacing */\n}\n\n/* ==========================================================================\n   wNEWS — Effects: radii, shadows, glows, motion, surface treatments\n   ========================================================================== */\n:root {\n  /* ---- Corner radii ---- */\n  --r-xs:   6px;\n  --r-sm:   10px;\n  --r-md:   14px;\n  --r-lg:   20px;\n  --r-xl:   28px;\n  --r-2xl:  36px;\n  --r-pill: 999px;\n\n  /* ---- Elevation (dark UI: shadows are deep + subtle) ---- */\n  --shadow-sm:  0 1px 2px rgba(0,0,0,0.40);\n  --shadow-md:  0 8px 24px rgba(0,0,0,0.45);\n  --shadow-lg:  0 24px 60px rgba(0,0,0,0.55);\n  --shadow-card: 0 1px 0 rgba(255,255,255,0.04) inset, 0 12px 40px rgba(0,0,0,0.45);\n\n  /* ---- Brand glows (auras behind CTAs, logo, hero orbs) ---- */\n  --glow-sm:  0 0 24px var(--glow-purple);\n  --glow-md:  0 8px 40px var(--glow-purple);\n  --glow-lg:  0 16px 70px rgba(155,77,240,0.40);\n  --glow-cta: 0 8px 30px rgba(255,79,203,0.35), 0 4px 14px rgba(108,59,255,0.30);\n\n  /* ---- Hairline brand ring (gradient border helper color) ---- */\n  --ring-grad: linear-gradient(135deg, rgba(255,79,203,0.6), rgba(108,59,255,0.6)); /* @kind color */\n\n  /* ---- Blur (glass panels / nav) ---- */\n  --blur-glass: saturate(140%) blur(16px); /* @kind other */\n\n  /* ---- Motion ---- */\n  --ease-out:   cubic-bezier(0.16, 1, 0.3, 1);    /* @kind other */\n  --ease-inout: cubic-bezier(0.65, 0, 0.35, 1);   /* @kind other */\n  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1); /* @kind other */\n  --dur-fast:   140ms; /* @kind other */\n  --dur-base:   240ms; /* @kind other */\n  --dur-slow:   480ms; /* @kind other */\n\n  /* ---- Texture: faint grid + radial brand wash for hero backdrops ---- */\n  --grid-line: rgba(255,255,255,0.035); /* @kind color */\n  --backdrop-wash:\n    radial-gradient(60% 50% at 18% 0%, rgba(255,79,203,0.16), transparent 60%),\n    radial-gradient(55% 55% at 95% 10%, rgba(108,59,255,0.18), transparent 60%); /* @kind color */\n}\n\n<\u002Fstyle>\n  <script src=\"0968d81b-869d-4385-897c-0f526bd152e9\"><\u002Fscript>\n  <script src=\"3cfbff31-2dc4-416a-9219-a4d6882a8266\"><\u002Fscript>\n  \n  <style>body{margin:0;background:#07060D;color:#C9C3DA}a{color:#FF8FDC}a:hover{color:#FFFFFF}<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;background:var(--ink-1000);padding:56px 56px 96px;display:flex;flex-direction:column;gap:72px;font-family:var(--font-sans);color:var(--text-body)\">\n\n  <header style=\"display:flex;flex-direction:column;gap:20px;max-width:900px\">\n    <div style=\"font:600 12px/1 var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--text-muted)\">Gloo · docs/MOTION.md · camera-first<\u002Fdiv>\n    <h1 style=\"margin:0;font:600 56px/1 var(--font-display);letter-spacing:-0.03em;color:var(--text-strong)\">Motion studies<\u002Fh1>\n    <p style=\"margin:0;font-size:17px;line-height:1.55;max-width:720px;text-wrap:pretty\">Six moments at 600×600 design size, light on black, for the phone stage over the viewfinder and the additive glasses display. Tap any stage to replay it. Word: cholecystokinin (chole · cysto · kin · in).<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:center\">\n      <div sc-camel-on-click=\"{{ toggleCut }}\"><x-import component-from-global-scope=\"WNEWSDesignSystem_05774d.Button\" variant=\"{{ cutVariant }}\" size=\"sm\" hint-size=\"160px,34px\">{{ cutLabel }}<\u002Fx-import><\u002Fdiv>\n      <div sc-camel-on-click=\"{{ toggleSound }}\"><x-import component-from-global-scope=\"WNEWSDesignSystem_05774d.Button\" variant=\"{{ soundVariant }}\" size=\"sm\" hint-size=\"120px,34px\">{{ soundLabel }}<\u002Fx-import><\u002Fdiv>\n      <div sc-camel-on-click=\"{{ replayAll }}\"><x-import component-from-global-scope=\"WNEWSDesignSystem_05774d.Button\" variant=\"ghost\" size=\"sm\" hint-size=\"100px,34px\">Replay all<\u002Fx-import><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section id=\"m1\" style=\"display:flex;flex-direction:column;gap:24px\">\n    <div style=\"display:flex;flex-direction:column;gap:8px\">\n      <div style=\"font:600 12px/1 var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--wn-pink-300)\">01 · Scan<\u002Fdiv>\n      <h2 style=\"margin:0;font:600 30px/1.1 var(--font-display);letter-spacing:-0.02em;color:var(--text-strong)\">I see the word. I'm reading it. Here are its pieces.<\u002Fh2>\n      <p style=\"margin:0;max-width:760px;line-height:1.5\">As decided: A on the phone, C on glasses. The A ticks stay and become the rail the pieces ride in later moments.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start\">\n      <div id=\"1a\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <x-import component-from-global-scope=\"gloo-stage\" moment=\"scan\" target=\"phone\" sid=\"1a\" size=\"420\" hint-size=\"420px,420px\"><\u002Fx-import>\n        <div style=\"display:flex;align-items:center;gap:10px\"><a href=\"#1a\" style=\"font:600 11px/1 var(--font-mono);padding:4px 7px;border-radius:5px;background:var(--ink-700);color:var(--text-strong);text-decoration:none\">1a<\u002Fa><span style=\"font-size:14px\">Phone · A, sweep with ticks<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"1b\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <x-import component-from-global-scope=\"gloo-stage\" moment=\"scan\" target=\"glasses\" sid=\"1b\" size=\"420\" hint-size=\"420px,420px\"><\u002Fx-import>\n        <div style=\"display:flex;align-items:center;gap:10px\"><a href=\"#1b\" style=\"font:600 11px/1 var(--font-mono);padding:4px 7px;border-radius:5px;background:var(--ink-700);color:var(--text-strong);text-decoration:none\">1b<\u002Fa><span style=\"font-size:14px\">Glasses · C, pulse count<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"m2\" style=\"display:flex;flex-direction:column;gap:24px\">\n    <div style=\"display:flex;flex-direction:column;gap:8px\">\n      <div style=\"font:600 12px/1 var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--wn-pink-300)\">02 · Stickiness<\u002Fdiv>\n      <h2 style=\"margin:0;font:600 30px/1.1 var(--font-display);letter-spacing:-0.02em;color:var(--text-strong)\">This word is a 1 to 5. 5 sticks by itself, 1 is slippery.<\u002Fh2>\n      <p style=\"margin:0;max-width:760px;line-height:1.5\">Five ticks fill from the scan rail, 120 ms each with a click. Slippery (shown as 2): ticks stay gloo orange and the word drops into the first piece card. Sticks (shown as 5): ticks cool to sea and the word lifts off. Only ticks and color show, no number.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start\">\n      <div id=\"2a\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <x-import component-from-global-scope=\"gloo-stage\" moment=\"stick\" target=\"phone\" variant=\"hot\" sid=\"2a\" size=\"420\" hint-size=\"420px,420px\"><\u002Fx-import>\n        <div style=\"display:flex;align-items:center;gap:10px\"><a href=\"#2a\" style=\"font:600 11px/1 var(--font-mono);padding:4px 7px;border-radius:5px;background:var(--ink-700);color:var(--text-strong);text-decoration:none\">2a<\u002Fa><span style=\"font-size:14px\">Phone · slippery, drops into the slot<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"2b\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <x-import component-from-global-scope=\"gloo-stage\" moment=\"stick\" target=\"phone\" variant=\"cool\" sid=\"2b\" size=\"420\" hint-size=\"420px,420px\"><\u002Fx-import>\n        <div style=\"display:flex;align-items:center;gap:10px\"><a href=\"#2b\" style=\"font:600 11px/1 var(--font-mono);padding:4px 7px;border-radius:5px;background:var(--ink-700);color:var(--text-strong);text-decoration:none\">2b<\u002Fa><span style=\"font-size:14px\">Phone · sticks, lifts and dissolves<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"2c\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <x-import component-from-global-scope=\"gloo-stage\" moment=\"stick\" target=\"glasses\" variant=\"hot\" sid=\"2c\" size=\"420\" hint-size=\"420px,420px\"><\u002Fx-import>\n        <div style=\"display:flex;align-items:center;gap:10px\"><a href=\"#2c\" style=\"font:600 11px/1 var(--font-mono);padding:4px 7px;border-radius:5px;background:var(--ink-700);color:var(--text-strong);text-decoration:none\">2c<\u002Fa><span style=\"font-size:14px\">Glasses · slippery<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"2d\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <x-import component-from-global-scope=\"gloo-stage\" moment=\"stick\" target=\"glasses\" variant=\"cool\" sid=\"2d\" size=\"420\" hint-size=\"420px,420px\"><\u002Fx-import>\n        <div style=\"display:flex;align-items:center;gap:10px\"><a href=\"#2d\" style=\"font:600 11px/1 var(--font-mono);padding:4px 7px;border-radius:5px;background:var(--ink-700);color:var(--text-strong);text-decoration:none\">2d<\u002Fa><span style=\"font-size:14px\">Glasses · sticks<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"m3\" style=\"display:flex;flex-direction:column;gap:24px\">\n    <div style=\"display:flex;flex-direction:column;gap:8px\">\n      <div style=\"font:600 12px/1 var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--wn-pink-300)\">03 · Pick<\u002Fdiv>\n      <h2 style=\"margin:0;font:600 30px/1.1 var(--font-display);letter-spacing:-0.02em;color:var(--text-strong)\">Four pictures. Say one. It's yours.<\u002Fh2>\n      <p style=\"margin:0;max-width:760px;line-height:1.5\">Confetti is replaced by a lock-in: the pick snaps to its slot on the rail and one ring flashes outward. Then chole rises out of it, ≈ cola pulses with the spoken line, and bile fades in last and smallest. On phone the unpicked tiles fall back and dim. On glasses they shrink instead. Tiles are text-only stand-ins for the pictures.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start\">\n      <div id=\"3a\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <x-import component-from-global-scope=\"gloo-stage\" moment=\"pick\" target=\"phone\" sid=\"3a\" size=\"420\" hint-size=\"420px,420px\"><\u002Fx-import>\n        <div style=\"display:flex;align-items:center;gap:10px\"><a href=\"#3a\" style=\"font:600 11px/1 var(--font-mono);padding:4px 7px;border-radius:5px;background:var(--ink-700);color:var(--text-strong);text-decoration:none\">3a<\u002Fa><span style=\"font-size:14px\">Phone · listed pick, lock-in<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"3b\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <x-import component-from-global-scope=\"gloo-stage\" moment=\"pick\" target=\"glasses\" sid=\"3b\" size=\"420\" hint-size=\"420px,420px\"><\u002Fx-import>\n        <div style=\"display:flex;align-items:center;gap:10px\"><a href=\"#3b\" style=\"font:600 11px/1 var(--font-mono);padding:4px 7px;border-radius:5px;background:var(--ink-700);color:var(--text-strong);text-decoration:none\">3b<\u002Fa><span style=\"font-size:14px\">Glasses · unpicked shrink<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"3c\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <x-import component-from-global-scope=\"gloo-stage\" moment=\"pick\" target=\"phone\" variant=\"offlist\" sid=\"3c\" size=\"420\" hint-size=\"420px,420px\"><\u002Fx-import>\n        <div style=\"display:flex;align-items:center;gap:10px\"><a href=\"#3c\" style=\"font:600 11px/1 var(--font-mono);padding:4px 7px;border-radius:5px;background:var(--ink-700);color:var(--text-strong);text-decoration:none\">3c<\u002Fa><span style=\"font-size:14px\">Phone · off-list answer, waveform tile<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"3d\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <x-import component-from-global-scope=\"gloo-stage\" moment=\"pick\" target=\"glasses\" variant=\"offlist\" sid=\"3d\" size=\"420\" hint-size=\"420px,420px\"><\u002Fx-import>\n        <div style=\"display:flex;align-items:center;gap:10px\"><a href=\"#3d\" style=\"font:600 11px/1 var(--font-mono);padding:4px 7px;border-radius:5px;background:var(--ink-700);color:var(--text-strong);text-decoration:none\">3d<\u002Fa><span style=\"font-size:14px\">Glasses · off-list answer<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"m4\" style=\"display:flex;flex-direction:column;gap:24px\">\n    <div style=\"display:flex;flex-direction:column;gap:8px\">\n      <div style=\"font:600 12px/1 var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--wn-pink-300)\">04 · All together<\u002Fdiv>\n      <h2 style=\"margin:0;font:600 30px/1.1 var(--font-display);letter-spacing:-0.02em;color:var(--text-strong)\">These pieces, in this order, are the word.<\u002Fh2>\n      <p style=\"margin:0;max-width:760px;line-height:1.5\">Pieces slide along the rail from pick order into word order, each carrying its pick. Each one lights as it is spoken. Then they rise into the whole word, which lights once as a unit, and the meaning appears under it. This is the only moment where the whole word is shown large.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start\">\n      <div id=\"4a\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <x-import component-from-global-scope=\"gloo-stage\" moment=\"together\" target=\"phone\" sid=\"4a\" size=\"420\" hint-size=\"420px,420px\"><\u002Fx-import>\n        <div style=\"display:flex;align-items:center;gap:10px\"><a href=\"#4a\" style=\"font:600 11px/1 var(--font-mono);padding:4px 7px;border-radius:5px;background:var(--ink-700);color:var(--text-strong);text-decoration:none\">4a<\u002Fa><span style=\"font-size:14px\">Phone<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"4b\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <x-import component-from-global-scope=\"gloo-stage\" moment=\"together\" target=\"glasses\" sid=\"4b\" size=\"420\" hint-size=\"420px,420px\"><\u002Fx-import>\n        <div style=\"display:flex;align-items:center;gap:10px\"><a href=\"#4b\" style=\"font:600 11px/1 var(--font-mono);padding:4px 7px;border-radius:5px;background:var(--ink-700);color:var(--text-strong);text-decoration:none\">4b<\u002Fa><span style=\"font-size:14px\">Glasses<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"m5\" style=\"display:flex;flex-direction:column;gap:24px\">\n    <div style=\"display:flex;flex-direction:column;gap:8px\">\n      <div style=\"font:600 12px/1 var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--wn-pink-300)\">05 · Practice<\u002Fdiv>\n      <h2 style=\"margin:0;font:600 30px/1.1 var(--font-display);letter-spacing:-0.02em;color:var(--text-strong)\">You got it. Not quite. Can't tell.<\u002Fh2>\n      <p style=\"margin:0;max-width:760px;line-height:1.5\">Feedback starts 60 ms after the answer is heard. Correct: a clean ring closes with a chime. Miss: a short shake, then the answer line. Uncertain: a soft ring that doesn't close. No red fills.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start\">\n      <div id=\"5a\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <x-import component-from-global-scope=\"gloo-stage\" moment=\"practice\" target=\"phone\" variant=\"hit\" sid=\"5a\" size=\"420\" hint-size=\"420px,420px\"><\u002Fx-import>\n        <div style=\"display:flex;align-items:center;gap:10px\"><a href=\"#5a\" style=\"font:600 11px/1 var(--font-mono);padding:4px 7px;border-radius:5px;background:var(--ink-700);color:var(--text-strong);text-decoration:none\">5a<\u002Fa><span style=\"font-size:14px\">Phone · correct<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"5b\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <x-import component-from-global-scope=\"gloo-stage\" moment=\"practice\" target=\"phone\" variant=\"miss\" sid=\"5b\" size=\"420\" hint-size=\"420px,420px\"><\u002Fx-import>\n        <div style=\"display:flex;align-items:center;gap:10px\"><a href=\"#5b\" style=\"font:600 11px/1 var(--font-mono);padding:4px 7px;border-radius:5px;background:var(--ink-700);color:var(--text-strong);text-decoration:none\">5b<\u002Fa><span style=\"font-size:14px\">Phone · miss<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"5c\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <x-import component-from-global-scope=\"gloo-stage\" moment=\"practice\" target=\"phone\" variant=\"unsure\" sid=\"5c\" size=\"420\" hint-size=\"420px,420px\"><\u002Fx-import>\n        <div style=\"display:flex;align-items:center;gap:10px\"><a href=\"#5c\" style=\"font:600 11px/1 var(--font-mono);padding:4px 7px;border-radius:5px;background:var(--ink-700);color:var(--text-strong);text-decoration:none\">5c<\u002Fa><span style=\"font-size:14px\">Phone · uncertain<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"5d\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <x-import component-from-global-scope=\"gloo-stage\" moment=\"practice\" target=\"glasses\" variant=\"hit\" sid=\"5d\" size=\"420\" hint-size=\"420px,420px\"><\u002Fx-import>\n        <div style=\"display:flex;align-items:center;gap:10px\"><a href=\"#5d\" style=\"font:600 11px/1 var(--font-mono);padding:4px 7px;border-radius:5px;background:var(--ink-700);color:var(--text-strong);text-decoration:none\">5d<\u002Fa><span style=\"font-size:14px\">Glasses · correct<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"5e\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <x-import component-from-global-scope=\"gloo-stage\" moment=\"practice\" target=\"glasses\" variant=\"miss\" sid=\"5e\" size=\"420\" hint-size=\"420px,420px\"><\u002Fx-import>\n        <div style=\"display:flex;align-items:center;gap:10px\"><a href=\"#5e\" style=\"font:600 11px/1 var(--font-mono);padding:4px 7px;border-radius:5px;background:var(--ink-700);color:var(--text-strong);text-decoration:none\">5e<\u002Fa><span style=\"font-size:14px\">Glasses · miss<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"5f\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <x-import component-from-global-scope=\"gloo-stage\" moment=\"practice\" target=\"glasses\" variant=\"unsure\" sid=\"5f\" size=\"420\" hint-size=\"420px,420px\"><\u002Fx-import>\n        <div style=\"display:flex;align-items:center;gap:10px\"><a href=\"#5f\" style=\"font:600 11px/1 var(--font-mono);padding:4px 7px;border-radius:5px;background:var(--ink-700);color:var(--text-strong);text-decoration:none\">5f<\u002Fa><span style=\"font-size:14px\">Glasses · uncertain<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"m6\" style=\"display:flex;flex-direction:column;gap:24px\">\n    <div style=\"display:flex;flex-direction:column;gap:8px\">\n      <div style=\"font:600 12px/1 var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--wn-pink-300)\">06 · Progress<\u002Fdiv>\n      <h2 style=\"margin:0;font:600 30px/1.1 var(--font-display);letter-spacing:-0.02em;color:var(--text-strong)\">Per skill, how far. And the picks you own.<\u002Fh2>\n      <p style=\"margin:0;max-width:760px;line-height:1.5\">One bar per skill, with a tick per review stage (now, 30m, 4h, 1d, 3d, 7d). Here Meaning passes the 4h stage and fills with a burst. The stickiness meter rests next to the word, and the picks sit under the bars.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start\">\n      <div id=\"6a\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <x-import component-from-global-scope=\"gloo-stage\" moment=\"progress\" target=\"phone\" sid=\"6a\" size=\"420\" hint-size=\"420px,420px\"><\u002Fx-import>\n        <div style=\"display:flex;align-items:center;gap:10px\"><a href=\"#6a\" style=\"font:600 11px/1 var(--font-mono);padding:4px 7px;border-radius:5px;background:var(--ink-700);color:var(--text-strong);text-decoration:none\">6a<\u002Fa><span style=\"font-size:14px\">Phone<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"6b\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <x-import component-from-global-scope=\"gloo-stage\" moment=\"progress\" target=\"glasses\" sid=\"6b\" size=\"420\" hint-size=\"420px,420px\"><\u002Fx-import>\n        <div style=\"display:flex;align-items:center;gap:10px\"><a href=\"#6b\" style=\"font:600 11px/1 var(--font-mono);padding:4px 7px;border-radius:5px;background:var(--ink-700);color:var(--text-strong);text-decoration:none\">6b<\u002Fa><span style=\"font-size:14px\">Glasses<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"parts\" style=\"display:flex;flex-direction:column;gap:24px\">\n    <div style=\"display:flex;flex-direction:column;gap:8px\">\n      <div style=\"font:600 12px/1 var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--wn-pink-300)\">Components<\u002Fdiv>\n      <h2 style=\"margin:0;font:600 30px/1.1 var(--font-display);letter-spacing:-0.02em;color:var(--text-strong)\">Tick rail and five-tick meter<\u002Fh2>\n      <p style=\"margin:0;max-width:760px;line-height:1.5\">Both are <span style=\"font-family:var(--font-mono);font-size:14px\">&lt;gloo-part kind state&gt;<\u002Fspan> in gloo-motion.js. Tap a part to replay it.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:140px repeat(5,280px);gap:16px 20px;align-items:center\">\n      <div><\u002Fdiv>\n      <div style=\"font:600 11px/1 var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--text-muted)\">empty<\u002Fdiv>\n      <div style=\"font:600 11px/1 var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--text-muted)\">filling<\u002Fdiv>\n      <div style=\"font:600 11px/1 var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--text-muted)\">filled-hot<\u002Fdiv>\n      <div style=\"font:600 11px/1 var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--text-muted)\">filled-cool<\u002Fdiv>\n      <div style=\"font:600 11px/1 var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--text-muted)\">resting<\u002Fdiv>\n      <div style=\"font:600 16px/1 var(--font-display);color:var(--text-strong)\">Tick rail<\u002Fdiv>\n      <x-import component-from-global-scope=\"gloo-part\" kind=\"rail\" state=\"empty\" sid=\"rail-empty\" hint-size=\"280px,120px\"><\u002Fx-import>\n      <x-import component-from-global-scope=\"gloo-part\" kind=\"rail\" state=\"filling\" sid=\"rail-filling\" hint-size=\"280px,120px\"><\u002Fx-import>\n      <x-import component-from-global-scope=\"gloo-part\" kind=\"rail\" state=\"filled-hot\" sid=\"rail-hot\" hint-size=\"280px,120px\"><\u002Fx-import>\n      <x-import component-from-global-scope=\"gloo-part\" kind=\"rail\" state=\"filled-cool\" sid=\"rail-cool\" hint-size=\"280px,120px\"><\u002Fx-import>\n      <x-import component-from-global-scope=\"gloo-part\" kind=\"rail\" state=\"resting\" sid=\"rail-rest\" hint-size=\"280px,120px\"><\u002Fx-import>\n      <div style=\"font:600 16px/1 var(--font-display);color:var(--text-strong)\">Meter<\u002Fdiv>\n      <x-import component-from-global-scope=\"gloo-part\" kind=\"meter\" state=\"empty\" sid=\"meter-empty\" hint-size=\"280px,120px\"><\u002Fx-import>\n      <x-import component-from-global-scope=\"gloo-part\" kind=\"meter\" state=\"filling\" sid=\"meter-filling\" hint-size=\"280px,120px\"><\u002Fx-import>\n      <x-import component-from-global-scope=\"gloo-part\" kind=\"meter\" state=\"filled-hot\" sid=\"meter-hot\" hint-size=\"280px,120px\"><\u002Fx-import>\n      <x-import component-from-global-scope=\"gloo-part\" kind=\"meter\" state=\"filled-cool\" sid=\"meter-cool\" hint-size=\"280px,120px\"><\u002Fx-import>\n      <x-import component-from-global-scope=\"gloo-part\" kind=\"meter\" state=\"resting\" sid=\"meter-rest\" hint-size=\"280px,120px\"><\u002Fx-import>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"sound\" style=\"display:flex;flex-direction:column;gap:24px\">\n    <div style=\"display:flex;flex-direction:column;gap:8px\">\n      <div style=\"font:600 12px/1 var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--wn-pink-300)\">Sound kit<\u002Fdiv>\n      <h2 style=\"margin:0;font:600 30px/1.1 var(--font-display);letter-spacing:-0.02em;color:var(--text-strong)\">Five effects, mono, under 400 ms<\u002Fh2>\n      <p style=\"margin:0;max-width:760px;line-height:1.5\">Synthesized in the browser, separate from the spoken line. These buttons play even with sound off. In the studies, effects and speech only play while Sound is on.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n      <sc-for list=\"{{ sfx }}\" as=\"s\" hint-placeholder-count=\"5\">\n        <div sc-camel-on-click=\"{{ s.play }}\"><x-import component-from-global-scope=\"WNEWSDesignSystem_05774d.Button\" variant=\"secondary\" size=\"md\" hint-size=\"110px,40px\"><span style=\"font-family:var(--font-mono)\">{{ s.name }}<\u002Fspan><span style=\"font-family:var(--font-mono);color:var(--text-muted);font-weight:400\">{{ s.ms }}<\u002Fspan><\u002Fx-import><\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"open\" style=\"display:flex;flex-direction:column;gap:16px;max-width:820px\">\n    <div style=\"font:600 12px/1 var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--wn-pink-300)\">Open questions · defaults used here<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 32px;line-height:1.5\">\n      <div style=\"color:var(--text-strong)\">Is the stickiness number ever visible?<\u002Fdiv><div>No. Ticks and color only.<\u002Fdiv>\n      <div style=\"color:var(--text-strong)\">On a 4–5, offer the lesson anyway?<\u002Fdiv><div>Not shown. The word lifts off and the loop closes.<\u002Fdiv>\n      <div style=\"color:var(--text-strong)\">Sound effects on by default?<\u002Fdiv><div>They follow the spoken-line setting (the Sound toggle).<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { cut: !!(window.GlooMotion && window.GlooMotion.cut), sound: false };\n  renderVals() {\n    const G = window.GlooMotion || {};\n    const ms = { tick: '35 ms', lock: '155 ms', chime: '390 ms', miss: '270 ms', lift: '340 ms' };\n    return {\n      cutLabel: this.state.cut ? 'Reduced motion: on' : 'Reduced motion: off',\n      cutVariant: this.state.cut ? 'soft' : 'secondary',\n      soundLabel: this.state.sound ? 'Sound: on' : 'Sound: off',\n      soundVariant: this.state.sound ? 'soft' : 'secondary',\n      toggleCut: () => { const v = !this.state.cut; this.setState({ cut: v }); G.setCut && G.setCut(v); },\n      toggleSound: () => { const v = !this.state.sound; this.setState({ sound: v }); G.setSound && G.setSound(v); },\n      replayAll: () => G.replayAll && G.replayAll(),\n      sfx: ['tick', 'lock', 'chime', 'miss', 'lift'].map((n) => ({ name: n, ms: ms[n], play: () => G.sfx && G.sfx(n, true) })),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
