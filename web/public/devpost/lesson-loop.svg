<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" role="img" aria-label="The lesson loop: word, pieces, picks, Qloo rank, voice and paw, practice, then the next word ranked for your taste">
<rect width="800" height="330" rx="14" fill="#000"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f1b33a"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2bb8a3"/></marker></defs>
<text x="24" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#f6f1e7">The lesson loop</text>
<text x="24" y="70" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="rgba(246,241,231,.58)">What you love gives you a way in. What you learn changes what you can love.</text>
