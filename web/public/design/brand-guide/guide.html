document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px\">\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"height:200px;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center\"><img src=\"a870d813-c6ad-4d1e-b53e-01915503e484\" alt=\"\" style=\"width:260px;height:auto\"><\u002Fdiv>\n          <div style=\"font-size:14px\">On light. Teal palm, navy wordmark, gold toes.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"height:200px;border-radius:18px;background:#0b1b2e;display:flex;align-items:center;justify-content:center\"><img src=\"d2679b62-a95e-4ce3-a3bc-bfaf356fe6d0\" alt=\"\" style=\"width:260px;height:auto\"><\u002Fdiv>\n          <div style=\"font-size:14px\">On dark. Brighter teal, cream wordmark.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"height:200px;border-radius:18px;background:#f6f1e7;display:flex;align-items:center;justify-content:center\"><img src=\"754dae7c-3f21-4ca4-ae0f-38a817adaaad\" alt=\"\" style=\"width:260px;height:auto\"><\u002Fdiv>\n          <div style=\"font-size:14px\">One color. For print, stamps and anywhere gold can’t be used.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;align-items:start\">\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"height:220px;border-radius:18px;background:#14120f;display:flex;align-items:center;justify-content:center\">\n            <div style=\"position:relative;padding:44px;outline:1px dashed rgba(246,241,231,.4);outline-offset:0\">\n              <div style=\"position:absolute;left:0;top:0;right:0;height:44px;background:rgba(224,165,38,.18)\"><\u002Fdiv>\n              <div style=\"position:absolute;left:0;bottom:0;right:0;height:44px;background:rgba(224,165,38,.18)\"><\u002Fdiv>\n              <div style=\"position:absolute;left:0;top:44px;bottom:44px;width:44px;background:rgba(224,165,38,.18)\"><\u002Fdiv>\n              <div style=\"position:absolute;right:0;top:44px;bottom:44px;width:44px;background:rgba(224,165,38,.18)\"><\u002Fdiv>\n              <img src=\"d2679b62-a95e-4ce3-a3bc-bfaf356fe6d0\" alt=\"\" style=\"width:200px;height:auto;display:block;position:relative\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:14px\"><b style=\"color:#f6f1e7\">Clear space.<\u002Fb> Keep the width of the “o” counter free on all sides (about a fifth of the logo height).<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"height:220px;border-radius:18px;background:#14120f;display:flex;align-items:flex-end;justify-content:center;gap:28px;padding-bottom:56px\">\n            <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px\"><img src=\"d2679b62-a95e-4ce3-a3bc-bfaf356fe6d0\" alt=\"\" style=\"width:96px;height:auto\"><span style=\"font:500 11px/1 'JetBrains Mono',monospace;color:rgba(246,241,231,.6)\">96px<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px\"><img src=\"d4b12b8a-5e90-47a2-aea0-efdf7603f89d\" alt=\"\" style=\"width:24px;height:auto\"><span style=\"font:500 11px/1 'JetBrains Mono',monospace;color:rgba(246,241,231,.6)\">24px<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px\"><img src=\"d4b12b8a-5e90-47a2-aea0-efdf7603f89d\" alt=\"\" style=\"width:16px;height:auto\"><span style=\"font:500 11px/1 'JetBrains Mono',monospace;color:rgba(246,241,231,.6)\">16px<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:14px\"><b style=\"color:#f6f1e7\">Minimum size.<\u002Fb> Full logo 96px wide. Below that use the icon, down to 16px. Under 24px use the all-gold token mark below.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"display:flex;flex-direction:column;gap:28px\">\n      <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"font:600 12px/1 'JetBrains Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:#E0A526\">02 · Token and small marks<\u002Fdiv><h2 style=\"margin:0;font:400 40px/1.05 'Instrument Serif',Georgia,serif;color:#f6f1e7\">All-gold paw on a dark disc<\u002Fh2><\u002Fdiv>\n      <p style=\"margin:0;max-width:640px;line-height:1.55\">Teal falls apart in token lists and favicons. At small sizes the whole paw goes gold on near-black, so it holds its shape on light and dark lists.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:36px;align-items:flex-end;padding:32px;border-radius:18px;background:#14120f\">\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px\"><img src=\"3f9e4218-5c48-40c2-8447-b3bfb5b452f4\" alt=\"\" width=\"16\" height=\"16\"><span style=\"font:500 11px/1 'JetBrains Mono',monospace;color:rgba(246,241,231,.6)\">16<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px\"><img src=\"c3b89426-a268-46de-99d7-2d01d5931636\" alt=\"\" width=\"32\" height=\"32\"><span style=\"font:500 11px/1 'JetBrains Mono',monospace;color:rgba(246,241,231,.6)\">32<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px\"><img src=\"553edd2c-63ad-49f6-8ce7-6d1ac0e95e57\" alt=\"\" width=\"64\" height=\"64\"><span style=\"font:500 11px/1 'JetBrains Mono',monospace;color:rgba(246,241,231,.6)\">64<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px\"><img src=\"e6c2d02f-2328-4ec1-b207-5b042c700c42\" alt=\"\" width=\"128\" height=\"128\"><span style=\"font:500 11px/1 'JetBrains Mono',monospace;color:rgba(246,241,231,.6)\">128<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px\"><img src=\"663bdf10-64ab-46a4-a086-05c7c900cdc6\" alt=\"\" width=\"128\" height=\"128\"><span style=\"font:500 11px/1 'JetBrains Mono',monospace;color:rgba(246,241,231,.6)\">app icon<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:36px;align-items:flex-end;padding:32px;border-radius:18px;background:#f6f1e7\">\n        <img src=\"3f9e4218-5c48-40c2-8447-b3bfb5b452f4\" alt=\"\" width=\"16\" height=\"16\"><img src=\"c3b89426-a268-46de-99d7-2d01d5931636\" alt=\"\" width=\"32\" height=\"32\"><img src=\"553edd2c-63ad-49f6-8ce7-6d1ac0e95e57\" alt=\"\" width=\"64\" height=\"64\"><img src=\"e6c2d02f-2328-4ec1-b207-5b042c700c42\" alt=\"\" width=\"128\" height=\"128\">\n        <span style=\"font-size:14px;color:#1d1a16;max-width:220px\">Same disc on a light list. The dark disc always travels with the gold paw.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"display:flex;flex-direction:column;gap:28px\">\n      <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"font:600 12px/1 'JetBrains Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:#E0A526\">03 · Color<\u002Fdiv><h2 style=\"margin:0;font:400 40px/1.05 'Instrument Serif',Georgia,serif;color:#f6f1e7\">Teal for the brand, gold for the mark<\u002Fh2><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px\">\n        <sc-for list=\"{{ swatches }}\" as=\"s\" hint-placeholder-count=\"10\">\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <div style=\"height:96px;border-radius:14px;background:{{ s.bg }};box-shadow:0 0 0 1px rgba(246,241,231,.14)\"><\u002Fdiv>\n            <div style=\"font:600 14px/1.2 'Hanken Grotesk',sans-serif;color:#f6f1e7\">{{ s.name }}<\u002Fdiv>\n            <div style=\"font:500 12px/1.3 'JetBrains Mono',monospace;color:rgba(246,241,231,.65)\">{{ s.hex }}<\u002Fdiv>\n            <div style=\"font-size:12px;line-height:1.35;color:rgba(246,241,231,.6)\">{{ s.use }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:16px;flex-wrap:wrap\">\n        <div style=\"height:36px;width:min(360px,100%);border-radius:18px;background:linear-gradient(90deg,#F6CB5C,#C98A12)\"><\u002Fdiv>\n        <span style=\"font-size:14px\">Gold gradient on the toes and token paw, top to bottom.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"display:flex;flex-direction:column;gap:28px\">\n      <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"font:600 12px/1 'JetBrains Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:#E0A526\">04 · Type<\u002Fdiv><h2 style=\"margin:0;font:400 40px/1.05 'Instrument Serif',Georgia,serif;color:#f6f1e7\">Three voices<\u002Fh2><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px\">\n        <div style=\"padding:24px;border-radius:18px;background:#14120f;display:flex;flex-direction:column;gap:10px\"><div style=\"font:400 44px/1 'Instrument Serif',Georgia,serif;color:#f6f1e7\">Gloo works through your <em style=\"color:#d9822b\">camera.<\u002Fem><\u002Fdiv><div style=\"font-size:13px;color:rgba(246,241,231,.6)\">Instrument Serif. Headlines on landing and in lessons.<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding:24px;border-radius:18px;background:#14120f;display:flex;flex-direction:column;gap:10px\"><div style=\"font:500 20px/1.4 'Hanken Grotesk',sans-serif;color:#f6f1e7\">Point at a hard word and say “gloo it”.<\u002Fdiv><div style=\"font-size:13px;color:rgba(246,241,231,.6)\">Hanken Grotesk. Body, buttons, spoken lines.<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding:24px;border-radius:18px;background:#14120f;display:flex;flex-direction:column;gap:10px\"><div style=\"font:600 13px/1.4 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#d9822b\">sounds like · ≈ cola<\u002Fdiv><div style=\"font-size:13px;color:rgba(246,241,231,.6)\">JetBrains Mono. Labels, pieces, tags.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0;max-width:640px;font-size:14px;line-height:1.5;color:rgba(246,241,231,.65)\">The wordmark’s rounded letters are drawn, not set in a font. Never retype it.<\u002Fp>\n    <\u002Fsection>\n\n    <section style=\"display:flex;flex-direction:column;gap:28px\">\n      <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"font:600 12px/1 'JetBrains Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:#E0A526\">05 · Use<\u002Fdiv><h2 style=\"margin:0;font:400 40px/1.05 'Instrument Serif',Georgia,serif;color:#f6f1e7\">Rules of thumb<\u002Fh2><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px\">\n        <div style=\"display:flex;flex-direction:column;gap:12px\"><div style=\"font:600 12px/1 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#2bb8a3\">Do<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:1.45\"><span>Use the on-dark logo over photos and the camera view, under a dark wash.<\u002Fspan><span>Use gold only on the toes, the token paw and the five-tick meter when it is full.<\u002Fspan><span>Keep the five toes as the five stickiness ticks everywhere they appear.<\u002Fspan><span>Use the mono ink logo when only one color is available.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px\"><div style=\"font:600 12px/1 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#FF5470\">Don’t<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:1.45\"><span>Don’t put the teal paw on mid-tone or busy backgrounds.<\u002Fspan><span>Don’t make the palm gold in the full logo. Only the all-gold token does that.<\u002Fspan><span>Don’t add outlines, glows, shadows or gradients to the wordmark.<\u002Fspan><span>Don’t stretch, rotate, or rearrange the paw and wordmark.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"display:flex;flex-direction:column;gap:20px\">\n      <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"font:600 12px/1 'JetBrains Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:#E0A526\">06 · Files<\u002Fdiv><h2 style=\"margin:0;font:400 40px/1.05 'Instrument Serif',Georgia,serif;color:#f6f1e7\">What’s in brand/<\u002Fh2><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 28px;font-size:14px;line-height:1.4\"><span style=\"font-family:'JetBrains Mono',monospace;color:#f6f1e7\">svg/<\u002Fspan><span>Vector logos (light, dark, all-gold, mono ink and white), icons, paw, token, app icon, favicon<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;color:#f6f1e7\">png/<\u002Fspan><span>Logos at 1x and 2x, icons and paw at 960px, all transparent<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;color:#f6f1e7\">token/gloo-token-16 … 1024.png<\u002Fspan><span>Gold paw on dark disc<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;color:#f6f1e7\">app-icon-512.png, -1024.png<\u002Fspan><span>Rounded square for app stores<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;color:#f6f1e7\">web/<\u002Fspan><span>favicon.ico (16, 32, 48), apple-touch-icon, 192 and 512 icons, maskable icon, og-image 1200×630, site.webmanifest, head-snippet.html<\u002Fspan><\u002Fdiv>\n      <p style=\"margin:0;max-width:640px;font-size:14px;line-height:1.5;color:rgba(246,241,231,.65)\">The vectors were traced from your concept image, so curves are close but not hand-drawn. Have a designer clean them up before launch.<\u002Fp>\n    <\u002Fsection>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  renderVals() {\n    return { swatches: [\n      { name: 'Gloo teal', hex: '#11917F', bg: '#11917F', use: 'Palm on light' },\n      { name: 'Bright teal', hex: '#2BB8A3', bg: '#2BB8A3', use: 'Palm on dark' },\n      { name: 'Gloo gold', hex: '#E0A526', bg: '#E0A526', use: 'Toes, token' },\n      { name: 'Gold light', hex: '#F6CB5C', bg: '#F6CB5C', use: 'Gradient top' },\n      { name: 'Gold deep', hex: '#C98A12', bg: '#C98A12', use: 'Gradient bottom' },\n      { name: 'Navy', hex: '#0F2A4D', bg: '#0F2A4D', use: 'Wordmark on light' },\n      { name: 'Night', hex: '#0B1B2E', bg: '#0B1B2E', use: 'Dark brand surface' },\n      { name: 'Ink', hex: '#0B0A09', bg: '#0B0A09', use: 'Token disc, app' },\n      { name: 'Paper', hex: '#F6F1E7', bg: '#F6F1E7', use: 'Wordmark on dark' },\n      { name: 'Gloo orange', hex: '#D9822B', bg: '#D9822B', use: 'UI accent, ticks' },\n    ] };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
